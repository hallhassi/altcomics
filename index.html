<!-- <p>Comics, like poetry, is too easy to read. The text is designed for immediate absorption and it is designed at every level. Sensing a trap, the savvy reader affects an embarrassed smile and shrugs. "It's beyond me," he says, and hands it back to you.</p>
<a href="https://apartment.gallery/altcomics/index.html">Altcomics at Apartment Gallery</a>
<p>Comics are like squats. Lacking basic infrastructure, it's required you build your own architecture. Everything's falling apart so you can't just make stuff hoping to be discovered. You have to actively participate in the gnarly business of making a public-facing collective while at the same time constructing the boundaries needed to make your own work in private. Publishing is a house of cards destabilized and reorganized by every update to the print medium since Gutenberg (and every update in post since the Pony Express). Each generation of printers attempts to obsolesce its predecessor. With print, the medium really is the message because the formal properties of print are the direct result of the technology, and the technology is interconnected, car-sized machines housed in specialized facilities in Southeast Asia. In other words, it's much more than the canvas and stretcher beams that undergird paintings. It's a very specialized technology on a scale in which geopolitics matter, especially now that Silicon Valley has exfiltrated the very essence of print, abstracting away all the friction that once surrounded it except the social networking effects and the means of turning a profit. The word “print” now evokes this very obsolescence, pointing to the era of communication that directly preceded our own, before “print to screen” became so ubiquitous it superseded print, before “publish” and “post” were buttons we could press anytime we felt like it. It's just as strange to think that a “printer” was once an actual human being rather than a piece of machinery. In the '90s, American comic books reached their industrial zenith. The entire industry was revitalized by the advent of Photoshop and color printing technology. It was the last gasp before paper was obsolesced entirely. In its wake, the folk art of webcomics and memes spored like mushrooms. These new things were products of vast networks of effects: you were seeing the tip of what could be a mountain of lore. But they felt (and still feel) germinal—revolutionary in their lack of continuity with the past. Net artists hoped the art world would be similarly revolutionized, but why would it? The art world is defined by the distance of its images from the public and the security of the institutions hiding them. By contrast, print aspires to be as homeless and ephemeral as a zeitgeist.</p>

<p>“I was thinking about these containers of recollections, where somebody can access a period of time and experience it from all these different perspectives. If time can be recorded in such an expansive way, then the future and the past will completely merge into one sprawling form. Both will be as set in stone as they are malleable, because if you can navigate something that already happened and alter it and create versions of it, how's that any different from a new event, whatever that might mean?” — Ryan Trecartin</p>
